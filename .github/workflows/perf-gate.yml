name: Performance

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  regression_check:
    name: Check for regressions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            features: "+avx2"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          shared-key: perf-gate
          cache-on-failure: true

      - name: Run performance gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_THRESHOLD_PCT: "2"
          PERF_RUNS: "3"
          PERF_WARMUPS: "1"
        run: bash .github/scripts/perf_gate.sh
