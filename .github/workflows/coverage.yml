name: Weekly coverage (tarpaulin)

on:
  schedule:
    - cron: "0 0 * * 1" # min hour day-of-month month day-of-week
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-tarpaulin
        run: |
          if ! command -v cargo-tarpaulin >/dev/null; then
            cargo install --locked cargo-tarpaulin
          fi

      - name: Generate HTML report
        run: |
          mkdir -p site
          cargo tarpaulin \
            --workspace \
            --exclude field-air \
            --exclude challenger-air \
            --exclude interpolation-air \
            --exclude fri-air \
            --out Html \
            --output-dir site
          mv site/tarpaulin-report.html site/index.html

      - name: Deploy coverage into gh-pages:/coverage
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: coverage
          keep_files: true
